name: HACS Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catch HACS rule changes that would break new installs.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: HACS validation
        # Pinned to a release tag rather than @main so a change upstream cannot
        # silently alter what CI enforces.
        uses: hacs/action@22.5.0
        with:
          category: integration
