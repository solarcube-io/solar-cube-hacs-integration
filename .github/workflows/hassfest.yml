name: Hassfest

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Hassfest tracks Home Assistant releases; run weekly to catch new rules.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master
